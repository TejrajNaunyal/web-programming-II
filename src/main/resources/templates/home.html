<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Learning Platform - Posts</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<h1>Learning Platform - Posts</h1>

<!-- Section to display posts and replies -->
<div th:each="post : ${posts}">
    <h2 th:text="${post.title}"></h2>
    <p th:text="${post.content}"></p>
    
    <h3>Replies:</h3>
    <ul th:each="reply : ${post.replies}">
        <li th:text="${reply.content}"></li>
    </ul>
    
    <!-- Reply form for each post -->
    <form th:action="@{'/posts/' + ${post.id} + '/reply'}" method="POST">
        <label for="replyContent">Your Reply:</label>
        <textarea id="replyContent" name="content" required></textarea>
        <button type="submit">Submit Reply</button>
    </form>
</div>

<!-- Button to create a new post -->
<a href="/posts/create">Create New Post</a>

</body>
</html>
