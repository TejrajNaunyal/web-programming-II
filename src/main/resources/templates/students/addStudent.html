<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" th:href="@{/css/student.css}">
</head>
<body>
    <h1>Add Student</h1>

    <form action="#" th:action="@{/students}" th:object="${student}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" th:value="*{name}"><br>
    
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" th:value="*{email}"><br>
    
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" th:value="*{age}"><br>
    
        <input type="submit" value="Submit">
    </form>
    

    <a href="/students" class="btn">Back to List</a>
</body>
</html>
